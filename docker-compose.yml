services:
  db:
    image: postgres:16
    container_name: capstone-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: images
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d images"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    container_name: capstone-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/images
      EFS_MOUNT_PATH: /mnt/images
      AUTO_CREATE_TABLES: "true"
      LOG_LEVEL: INFO
      ENV: dev
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      X_API_KEY: local-dev-key
    ports:
      - "8000:8000"
    volumes:
      - backend-images:/mnt/images
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./front-end
      target: dev
    container_name: capstone-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE: http://localhost:8000
      VITE_API_KEY: local-dev-key
    ports:
      - "5173:5173"
    volumes:
      - ./front-end/src:/app/src
      - ./front-end/index.html:/app/index.html
      - ./front-end/vite.config.ts:/app/vite.config.ts

volumes:
  postgres-data:
  backend-images:
